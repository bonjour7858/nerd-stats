<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NerdStats — Public YouTube Analytics</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --card-inner: #1e2230;
      --text-main: #ffffff;
      --text-sub: #8a8f9d;
      --accent-color: #ff4500;
      --green-color: #00e676;
      --border-color: #2a2e3d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 650px;
      margin-bottom: 30px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .search-box button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background-color: #e03d00;
    }

    /* Carte de résultats */
    .analysis-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 750px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .card-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    .thumb-container img {
      width: 100%;
      border-radius: 8px;
      object-fit: cover;
      aspect-ratio: 16/9;
    }

    .video-info h2 {
      font-size: 1.2rem;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .video-info .channel {
      color: var(--text-sub);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background-color: var(--card-inner);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .stat-box .label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-box .value {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .revenue-box .value {
      color: var(--green-color);
    }

    .revenue-box .subtext {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .score-box {
      border: 1px solid var(--accent-color);
      text-align: center;
      padding: 16px;
    }

    .score-box .score-val {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
    }

    .share-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: var(--card-inner);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .share-btn:hover {
      background-color: var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <h1>NerdStats Studio</h1>
    <p class="subtitle">Analyse publique et métriques YouTube en temps réel</p>
  </header>

  <!-- Barre de recherche -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Colle le lien d'une vidéo YouTube ici...">
    <button id="searchBtn">Analyser</button>
  </div>

  <!-- Carte d'analyse (Masquée par défaut grâce à style="display: none;") -->
  <div id="resultsCard" class="analysis-card" style="display: none;">
    <div class="card-grid">
      
      <!-- Colonne Gauche : Miniature, Titre, Score -->
      <div>
        <div class="thumb-container">
          <img id="videoThumbnail" src="" alt="Miniature Vidéo">
        </div>

        <div class="video-info" style="margin-top: 15px;">
          <h2 id="videoTitle">-</h2>
          <div id="channelTitle" class="channel">-</div>
        </div>

        <div class="stat-box score-box" style="margin-top: 15px;">
          <div class="label">NERDSCORE</div>
          <div id="nerdScoreValue" class="score-val">- / 100</div>
          <div style="font-size: 0.75rem; color: var(--text-sub); margin-top: 4px;">
            Basé sur les signaux d'engagement publics.
          </div>
        </div>
      </div>

      <!-- Colonne Droite : Métriques clés -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="label">VUES</div>
          <div id="statViews" class="value">-</div>
        </div>

        <div class="stat-box">
          <div class="label">LIKES</div>
          <div id="statLikes" class="value">-</div>
        </div>

        <div class="stat-box">
          <div class="label">ENGAGEMENT PUBLIC</div>
          <div id="statEngagement" class="value">-</div>
        </div>

        <div class="stat-box">
          <div class="label">COMMENTAIRES</div>
          <div id="statComments" class="value">-</div>
        </div>

        <div class="stat-box full-width revenue-box">
          <div class="label">REVENU ESTIMÉ</div>
          <div id="statRevenue" class="value">-</div>
          <div class="subtext">
            Estimation basée sur des plages de RPM standard ($0.50 - $2.50). Les revenus réels varient.
          </div>
        </div>
      </div>

    </div>

    <button class="share-btn" onclick="navigator.clipboard.writeText(window.location.href); alert('Lien copié !');">
      Partager l'Analyse
    </button>
  </div>

  <!-- Injection de la Clé API globale et des scripts JS -->
  <script>
    // Mets ta clé API YouTube fonctionnelle ici
    window.YOUTUBE_API_KEY = "TA_CLE_API_YOUTUBE_ICI";
  </script>
  <script src="js/app.js"></script>
</body>
</html>
